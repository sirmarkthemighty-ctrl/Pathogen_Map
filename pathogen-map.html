d all and Collapse all buttons; Saved list (star a pathogen); link to a pathogen (Copy link); keyboard access and screen-reader labels; Thai or English interface (group names and labels)','Ten more bacteria from the handbook: rifampicin-resistant / MDR-TB regimens, M. marinum, M. ulcerans, rapidly growing mycobacteria, Salmonella Paratyphi, H. ducreyi, K. granulomatis, M. genitalium, Gardnerella (bacterial vaginosis), Chlamydia pneumoniae','Every organism named in the handbook Gram-stain diagrams is now in the map (Bacillus, more Clostridium, Corynebacterium, Brucella, Bartonella, Francisella, HACEK members and others); those with no handbook treatment show no drugs and say so','Systemic protozoa grouped as Plasmodium (malaria), kinetoplastids (Leishmania, Trypanosoma) and Toxoplasma; cutaneous and mucocutaneous leishmaniasis added','More fungi: Fusarium, Scedosporium, Aspergillus terreus and other Aspergillus, dermatophytes, Rhizopus, Lichtheimia, Mucor, Cryptococcus gattii, Trichosporon, Malassezia, Candida lusitaniae and guilliermondii, Sporothrix (handbook); Blastomyces, Coccidioides, Paracoccidioides (general knowledge, flagged)','Cryptococcus species grouped under one Cryptococcus node','Added mpox virus (general knowledge, flagged: not in the handbook)','Mycobacteria grouped as tuberculosis complex and non-tuberculous mycobacteria (slow- and rapid-growing)','Notes view: tapping a group, organism or drug opens its details beside the row, joined by an arrow (✕ or Escape closes it)','Organisms no longer expand into drug lines: treatment is in the details (tap a drug name there for its handbook dose); only groups with subgroups or organisms have a drop-down','Endemic area shown for every organism (worldwide unless stated)','Notes view: the last branch line of every group is now aligned with its siblings','Audited against the page images: endocarditis regimens (empirical, streptococci, enterococci, staphylococci), meningitis by patient type and the pneumonia table  genus grouped (Enterococcus, Klebsiella, Burkholderia, Aspergillus, Chlamydia, Clostridium, Bordetella, Leishmania, Moraxella); MSSA and MRSA placed under a Staphylococcus aureus group; smoother detail pop-up animation (slide and fade in, fade out on close, eased side panel); clicking outside the detail pop-up closes it; Print button for one organism (one-page summary), Recent filter (last 10 opened), keyboard focus ring on the toolbar buttons; organism-specific screening and diagnostic tests written for 71 organisms that used the shared group text; drug view now groups drugs by class (penicillins, cephalosporins, BLBI, carbapenems, aminoglycosides, antifungals and so on); Notes is now the default view; animations: Map/Notes cross-fade, list fade when searching or filtering, swipe-down to close the phone sheet, Tools window fade, tab cross-fade, count ticking, press feedback; 22 more parasites (Cyclospora, Cystoisospora, Dientamoeba, Capillaria, Trichinella, Toxocara, cutaneous larva migrans, Onchocerca, Loa loa, Taenia saginata, Diphyllobothrium, Hymenolepis, Fasciolopsis, pubic lice from the handbook; Clonorchis, Blastocystis, Balantidium, Babesia, sleeping sickness, free-living amoebae, Microsporidia as general knowledge); new groups for filarial nematodes, Taenia and free-living amoebae; Trypanosoma cruzi and T. brucei grouped under Trypanosoma spp.; 11 more NTM (M. chelonae, fortuitum, scrofulaceum, gordonae, haemophilum from the handbook; xenopi, szulgai, malmoense, genavense, simiae, mucogenicum as general knowledge) with slowly growing NTM grouped by the handbook Runyon scheme; redundant generic rapid-grower entry moved to its group; Pathogenicity filter (pathogenic / usually non-pathogenic) in Filters, with a note on the 11 commensals and contaminants; narrower branch indentation on phones; stale test entries removed; data-check script added; more Klebsiella (K. oxytoca, hypervirulent K. pneumoniae, K. aerogenes, K. variicola); more minimal layout: detail h, Ebola, Lassa, CCHF, hantavirus, EBV, rhinovirus, MERS-CoV, mumps, rubella, parvovirus B19, poliovirus, EV-A71 and coxsackie, hepatitis D, HPV, molluscum, HTLV-1) with new neurotropic, haemorrhagic fever, enterovirus and skin virus groups; optional Show related (More menu): a search also shows, in grey, the other members of the matching group and the other groups beside it, in both views, for comparing organisms; phone detail sheet has a drag handle: drag up for a taller sheet (up to 92%), tap to toggle half and full, drag down to shrink or close; Notes view falls back to the system font instead of a script face on phones, and a Plain font option in More','Drug lists checked against the Siriraj Handbook of Infectious Disease: each checked entry shows its handbook page; unchecked entries are labelled','Added from the handbook: Shigella, EHEC, viruses (VZV, measles, dengue, chikungunya/Zika, influenza, RSV, SARS-CoV-2, hepatitis A/B/C/E, HIV), S. suis, group C/G streptococci, non-typhoidal Salmonella, rickettsiae, M. kansasii, M. abscessus, Pneumocystis, Mucorales, Histoplasma','Mind map of bacteria, fungi, protozoa and parasites (helminths, ectoparasites): 73 pathogens, each with first-line, alternative and avoid drugs','Notes view: handwritten-style outline on grid paper with bracket connectors (toggle next to the theme button)','Gram-positive cocci split by lab test: staphylococci (coagulase-positive / -negative) and streptococci & enterococci (β-, α-, γ-hemolytic)','Tap a drug to see every pathogen that lists it','Search by pathogen or drug; pan and zoom; light/dark theme'],bugs:[]}];

 if(flt.p.size&&!flt.p.has(NP.has(p.n)?'c':'p'))return false;

const dgroup=n=>{const b=n.replace(/^add\s+/i,'');const g=DGRP.find(x=>x[3].test(b));return g?g[0]:'oth'};
function drugList(){
 const q=($('#dq').value||'').trim().toLowerCase(),idx=drugIndex(),th=lang==='th';
 const hit=idx.filter(e=>!q||e.name.toLowerCase().includes(q));
 const by={};hit.forEach(e=>{(by[dgroup(e.name)]=by[dgroup(e.name)]||[]).push(e)});
 const order=DGRP.map(x=>[x[0],th?x[2]:x[1]]).concat([['oth',th?'อื่น ๆ':'Other']]);
 $('#dlist').innerHTML=order.filter(g=>by[g[0]]).map(g=>'<div class="dgh">'+esc(g[1])+' <span class="by">('+by[g[0]].length+')</span></div><div class="chips">'+by[g[0]].map(e=>'<button class="chip" data-dsel="'+esc(e.name)+'" aria-pressed="'+(tDrugSel===e.name)+'">'+esc(e.name)+' <span class="by">'+(e.o.f.size+e.o.a.size+e.o.x.size)+'</span></button>').join('')+'</div>').join('')||'<span class="by">'+esc(T('none'))+'</span>'}
function orgLi(n){const p=orgBy(n);return '<li><span class="pl" data-go="'+esc(n)+'" tabindex="0" role="link">'+esc(n)+'</span> <span class="by">'+esc(p?topName(p):'')+'</span></li>'}
function drugDetail(){
 const box=$('#ddet');if(!tDrugSel){box.innerHTML='';return}
 const e=drugIndex().find(x=>x.name===tDrugSel);if(!e){box.innerHTML='';return}
 const ds=doseFor(e.name),lab={f:T('first'),a:T('alt'),x:T('avoid')},col={f:'var(--f)',a:'var(--a)',x:'var(--x)'};
 const dose=ds?'<details open style="--c:var(--acc)"><summary>'+esc(T('dose'))+'</summary><ul class="dl"><li><b>'+esc(T('dclass'))+':</b> '+esc(ds[1])+'</li><li><b>'+esc(T('duse'))+':</b> '+esc(ds[2])+'</li><li><b>'+esc(T('ddose'))+':</b> '+esc(ds[3])+'</li>'+(ds[4]?'<li><b>'+esc(T('dadr'))+':</b> '+esc(ds[4])+'</li>':'')+'</ul><div class="by">'+esc(T('source'))+' '+HBN+', '+(ds[5]||'pp. 34–38')+'.</div></details>':'<div class="by">'+esc(T('nodose'))+'</div>';
 box.innerHTML='<h3 style="margin:12px 0 4px">'+esc(e.name)+' <button class="ib sm" data-cadd-d="'+esc(e.name)+'">⇄ '+esc(T('cmp'))+'</button></h3>'+dose+
  ['f','a','x'].map(r=>e.o[r].size?'<details open style="--c:'+col[r]+'"><summary>'+esc(lab[r])+' ('+e.o[r].size+')</summary><ul>'+[...e.o[r]].sort().map(orgLi).join('')+'</ul></details>':'').join('')}
function renderEmp(){
 const syn=P.filter(p=>p.syn);
 $('#tbody').innerHTML='<p class="by">'+esc(T('t2h'))+'</p><label class="by" for="es">'+esc(T('t2s'))+'</label><select id="es" class="tin">'+syn.map(p=>'<option value="'+esc(p.n)+'">'+esc(p.n)+'</option>').join('')+'</select>'+
  '<div class="fs"><h4>'+esc(T('t2m'))+'</h4><div class="chips">'+EMPMODS.map(m=>'<button class="chip" data-mod="'+m[0]+'" aria-pressed="false">'+esc(m[1])+'</button>').join('')+'</div></div><div id="eres"></div>';
 empResult()}
function empResult(){
 const p=orgBy($('#es').value),mods=[...document.querySelectorAll('#tbody [data-mod][aria-pressed="true"]')].map(b=>b.dataset.mod);
 const sel=EMPMODS.filter(m=>mods.includes(m[0])),col={f:'var(--f)',a:'var(--a)'};
 const li=l=>{const h=sel.filter(m=>m[2].test(l)).map(m=>m[1]);return '<li'+(h.length?' class="mh"':'')+'>'+esc(l)+(h.length?' <span class="by">← '+esc(h.join('; '))+'</span>':'')+'</li>'};
 $('#eres').innerHTML='<h3 style="margin:10px 0 4px">'+esc(p.n)+'</h3>'+
  (p.note?'<div class="by">'+esc(p.note)+'</div>':'')+
  '<details open style="--c:var(--f)"><summary>'+esc(T('emp'))+'</summary><ul>'+p.f.map(li).join('')+'</ul></details>'+
  (p.a.length?'<details open style="--c:var(--a)"><summary>'+esc(T('alt'))+'</summary><ul>'+p.a.map(li).join('')+'</ul></details>':'')+
  '<div class="warn">'+esc(T('t2w'))+' '+esc(T('source'))+' '+HBN+', '+esc(p.h||'')+'. '+esc(T('verify'))+'</div>'}
function renderClues(){
 $('#tbody').innerHTML='<p class="by">'+esc(T('t3h'))+'</p>'+Object.keys(CLUEGRP).map(g=>'<div class="fs"><h4>'+esc(CLUEGRP[g])+'</h4><div class="chips">'+CLUES.filter(c=>c[1]===g).map(c=>'<button class="chip" data-clue="'+c[0]+'" aria-pressed="'+clueSel.has(c[0])+'">'+esc(c[2])+'</button>').join('')+'</div></div>').join('')+'<div id="cres"></div>';
 clueResult()}
function clueResult(){
 const sel=CLUES.filter(c=>clueSel.has(c[0])),box=$('#cres');
 if(!sel.length){box.innerHTML='<div class="by">'+esc(T('t3e'))+'</div>';return}
 const sc=new Map();sel.forEach(c=>c[3].forEach(n=>{if(!sc.has(n))sc.set(n,[]);sc.get(n).push(c[2])}));
 const rows=[...sc.entries()].filter(([n])=>orgBy(n)).sort((a,b)=>b[1].length-a[1].length||a[0].localeCompare(b[0])).slice(0,40);
 box.innerHTML='<h3 style="margin:12px 0 4px">'+esc(T('t3r'))+' ('+rows.length+')</h3><ul class="cl">'+rows.map(([n,m])=>'<li><span class="pl" data-go="'+esc(n)+'" tabindex="0" role="link">'+esc(n)+'</span> <b>'+m.length+'/'+sel.length+'</b> <span class="by">'+esc(m.join(' · '))+'</span></li>').join('')+'</ul><div class="warn">'+esc(T('t3w'))+'</div>'}
function addCmp(name,drug){const a=drug?cmp.d:cmp.o;cmp.mode=drug?'d':'o';if(!a.includes(name))a.push(name);if(a.length>3)a.shift()}
function renderCmp(){
 const m=cmp.mode,items=cmp[m];
 $('#tbody').innerHTML='<div class="chips"><button class="chip" data-cmode="o" aria-pressed="'+(m==='o')+'">'+esc(T('t4o'))+'</button><button class="chip" data-cmode="d" aria-pressed="'+(m==='d')+'">'+esc(T('t4d'))+'</button></div>'+
  '<p class="by">'+esc(T('t4h'))+'</p><input id="cq" type="search" class="tin" placeholder="'+esc(T('t4p'))+'" aria-label="'+esc(T('t4p'))+'"><div id="clist" class="chips"></div><div id="ctab"></div>';
 cmpList();cmpTable()}
function cmpList(){
 const q=($('#cq').value||'').trim().toLowerCase(),m=cmp.mode;
 const pool=m==='o'?P.filter(p=>!p.syn).map(p=>p.n):drugIndex().map(e=>e.name);
 const hit=pool.filter(n=>q&&n.toLowerCase().includes(q)).slice(0,24);
 $('#clist').innerHTML=hit.map(n=>'<button class="chip" data-cadd="'+esc(n)+'">+ '+esc(n)+'</button>').join('')}
function cmpTable(){
 const m=cmp.mode,items=cmp[m],box=$('#ctab');
 if(!items.length){box.innerHTML='';return}
 const ul=a=>a&&a.length?'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<span class="by">—</span>';
 let rows;
 if(m==='o'){
  const ps=items.map(orgBy).filter(Boolean);
  rows=[[T('fk'),ps.map(p=>esc(topName(p)))],[T('fe'),ps.map(p=>esc(endemicOf(p)||T('ww')))],[T('tsc'),ps.map(p=>esc(testsOf(p)[0]))],[T('tdx'),ps.map(p=>esc(testsOf(p)[1]))],[T('first'),ps.map(p=>ul(p.f))],[T('alt'),ps.map(p=>ul(p.a))],[T('avoid'),ps.map(p=>ul(p.x))],[T('key'),ps.map(p=>esc(p.note||'—'))],[T('source'),ps.map(p=>esc(p.h?HBN+', '+p.h:p.nh?T('nh'):T('unchecked')))]];
  items.length=ps.length;
 }else{
  const es=items.map(n=>drugIndex().find(e=>e.name===n)).filter(Boolean),ds=es.map(e=>doseFor(e.name));
  const sets=es.map(e=>new Set([...e.o.f,...e.o.a])),common=sets.length>1?[...sets[0]].filter(n=>sets.every(s=>s.has(n))).sort():[];
  rows=[[T('dclass'),ds.map(d=>esc(d?d[1]:'—'))],[T('duse'),ds.map(d=>esc(d?d[2]:'—'))],[T('ddose'),ds.map(d=>esc(d?d[3]:'—'))],[T('dadr'),ds.map(d=>esc(d&&d[4]?d[4]:'—'))],[T('first'),es.map(e=>ul([...e.o.f].sort()))],[T('alt'),es.map(e=>ul([...e.o.a].sort()))],[T('avoid'),es.map(e=>ul([...e.o.x].sort()))]];
  if(sets.length>1)rows.push([T('t4c'),[ul(common)].concat(es.slice(1).map(()=>''))]);
  items.length=es.length;
 }
 box.innerHTML='<div class="cwrap"><table class="cmpt"><thead><tr><th></th>'+items.map(n=>'<th>'+esc(n)+' <button class="ib sm" data-crem="'+esc(n)+'" aria-label="Remove">✕</button></th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr><th>'+esc(r[0])+'</th>'+r[1].map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function goOrg(name){
 const p=orgBy(name);if(!p)return;
 closeTools();Object.values(flt).forEach(s=>s.clear());updateFl();q='';$('#q').value='';savedOnly=false;recentOnly=false;syncBtns();
 cur=null;for(let g=p.c;g;g=CAT[g].g)open.add(g);sel='p:'+name;
 if(mode==='notes'){cur=p;detKey=sel;setHash(p);renderNotes();const el=document.querySelector('#notes .det');el&&el.scrollIntoView({block:'center'})}
 else{fit();showDetails(sel)}}
$('#tl').onclick=()=>openTools();
$('#tcl').onclick=closeTools;
$('#tkit').addEventListener('click',e=>{
 if(e.target.id==='tkit'){closeTools();return}
 const g=e.target.closest('[data-go]');if(g){goOrg(g.dataset.go);return}
 const tb=e.target.closest('[data-tab]');if(tb){tTab=tb.dataset.tab;renderTools();return}
 const ds=e.target.closest('[data-dsel]');if(ds){tDrugSel=ds.dataset.dsel;drugList();drugDetail();return}
 const cd=e.target.closest('[data-cadd-d]');if(cd){addCmp(cd.dataset.caddD,true);tTab='cmp';renderTools();return}
 const md=e.target.closest('[data-mod]');if(md){md.setAttribute('aria-pressed',md.getAttribute('aria-pressed')!=='true');empResult();return}
 const cl=e.target.closest('[data-clue]');if(cl){const k=cl.dataset.clue;if(clueSel.has(k))clueSel.delete(k);else clueSel.add(k);cl.setAttribute('aria-pressed',clueSel.has(k));clueResult();return}
 const cm=e.target.closest('[data-cmode]');if(cm){cmp.mode=cm.dataset.cmode;renderCmp();return}
 const ca=e.target.closest('[data-cadd]');if(ca){addCmp(ca.dataset.cadd,cmp.mode==='d');renderCmp();return}
 const cr=e.target.closest('[data-crem]');if(cr){const a=cmp[cmp.mode],i=a.indexOf(cr.dataset.crem);if(i>=0)a.splice(i,1);renderCmp();return}});
$('#tkit').addEventListener('input',e=>{if(e.target.id==='dq')drugList();else if(e.target.id==='cq')cmpList()});
$('#tkit').addEventListener('change',e=>{if(e.target.id==='es')empResult()});
$('#tkit').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.pl')){e.preventDefault();e.target.click()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#tkit').hidden)closeTools()});

applyLang(true);

setMode('notes'); // Notes is the default view
fit();openFromHash();
