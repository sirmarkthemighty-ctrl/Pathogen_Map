<script>
const changelogData=[{version:'1.1.0',date:'November 26, 2026',dateTh:'26 พฤศจิกายน 2569',features:['Added the organisms named in Murray that had no entry (bacteria, viruses, fungi and fungus-like organisms, protozoa, helminths and ectoparasites), with treatment from Murray or Mandell; entries without a source regimen are left empty.','Large groups such as Bacteria and Fungi now sit in a box.','Respiratory viruses are grouped by family: influenza, coronaviruses, and paramyxoviruses and pneumoviruses.','Notes view: SARS-CoV-2 now shows the antiviral for people at risk, MERS shows supportive care, and phrases such as no licensed therapeutic are no longer cut off.','BK polyomavirus: differences in the 2024 international consensus added (Reidy et al., J Clin Med 2025): no cidofovir, leflunomide, fluoroquinolones or statins; IVIG only; trough targets; re-transplantation.','BK polyomavirus: screening, thresholds, stepwise immunosuppression reduction, adjunct doses and the advice against fluoroquinolones from Thai Transplant Care 2025.','Added BK polyomavirus (Mandell), human herpesviruses 6 and 7 (Mandell) and 8 (NIH HIV guideline), and HPV type groups with their diseases (Murray).','Notes view: the ▾ marker now follows the name, and each connector line drops from under the second letter of its parent.','Groups reorganised after Murray, Medical Microbiology (9th ed) for easier learning. Gram-negative rods: the MacConkey and oxidase key is replaced by Enterobacteriaceae, non-fermenting rods, Vibrio and Aeromonas, curved rods, and miscellaneous rods.','Listeria, Erysipelothrix and Corynebacterium share a group; Rhodococcus joins the mycobacteria and Nocardia group; Actinomyces and Bacteroides are labelled as anaerobes.','Viruses: viral exanthems, arboviruses and retroviruses have their own groups; mpox sits with the skin viruses and mumps with the respiratory viruses.','Dermatophytes and Malassezia form a superficial mycoses group; flukes are split into liver, lung, blood and intestinal.'],featuresTh:['เพิ่มเชื้อที่ Murray กล่าวถึงแต่ยังไม่มีรายการ (แบคทีเรีย ไวรัส เชื้อราและสิ่งมีชีวิตคล้ายเชื้อรา โปรโตซัว หนอนพยาธิ และปรสิตภายนอก) โดยใช้การรักษาจาก Murray หรือ Mandell รายการที่แหล่งอ้างอิงไม่ให้สูตรยาจะเว้นว่าง','กลุ่มใหญ่ เช่น แบคทีเรียและเชื้อรา แสดงในกรอบ','จัดกลุ่มไวรัสทางเดินหายใจตามวงศ์ ได้แก่ ไข้หวัดใหญ่ โคโรนาไวรัส และพารามิกโซไวรัสกับนิวโมไวรัส','มุมมองโน้ต: SARS-CoV-2 แสดงยาต้านไวรัสสำหรับผู้มีปัจจัยเสี่ยง MERS แสดงการรักษาประคับประคอง และข้อความไม่ถูกตัดกลางคำ','BK polyomavirus: เพิ่มข้อแตกต่างจากฉันทามตินานาชาติปี 2024 (Reidy และคณะ, J Clin Med 2025) ได้แก่ ไม่แนะนำ cidofovir, leflunomide, fluoroquinolone และ statin สนับสนุนเฉพาะ IVIG เป้าระดับยา และการปลูกถ่ายซ้ำ','BK polyomavirus: การคัดกรอง เกณฑ์เริ่มรักษา ขั้นตอนการลดยากดภูมิคุ้มกัน ขนาดยาเสริม และคำแนะนำไม่ใช้ fluoroquinolone จาก Thai Transplant Care 2025','เพิ่ม BK polyomavirus (Mandell), human herpesvirus 6 และ 7 (Mandell) และ 8 (แนวทาง HIV ของ NIH) และกลุ่มชนิดของ HPV พร้อมโรคที่สัมพันธ์ (Murray)','มุมมองโน้ต: เครื่องหมาย ▾ อยู่หลังชื่อ และเส้นเชื่อมลากลงมาใต้ตัวอักษรที่สองของชื่อกลุ่มแม่','จัดกลุ่มใหม่ตาม Murray, Medical Microbiology (ฉบับที่ 9) เพื่อให้เรียนง่ายขึ้น แกรมลบรูปแท่ง: แทนผังการทดสอบ MacConkey และ oxidase ด้วยกลุ่ม Enterobacteriaceae, แกรมลบไม่หมักน้ำตาล, Vibrio และ Aeromonas, แบคทีเรียรูปโค้ง และกลุ่มอื่น ๆ','Listeria, Erysipelothrix และ Corynebacterium อยู่กลุ่มเดียวกัน Rhodococcus ย้ายไปอยู่กับ Mycobacterium และ Nocardia ส่วน Actinomyces และ Bacteroides ระบุว่าเป็นเชื้อไม่ใช้ออกซิเจน','ไวรัส: แยกกลุ่มไวรัสที่ทำให้เกิดผื่น อาร์โบไวรัส และรีโทรไวรัส mpox ย้ายไปกลุ่มไวรัสผิวหนัง และคางทูมไปกลุ่มไวรัสทางเดินหายใจ','เชื้อรา dermatophytes และ Malassezia เป็นกลุ่มโรคเชื้อราชั้นตื้น และแยกพยาธิใบไม้เป็นตับ ปอด เลือด และลำไส้'],bugs:[],bugsTh:[]},{version:'1.0.0',date:'November 24, 2026',dateTh:'24 พฤศจิกายน 2569',features:['Notes view: the first-line drug text now lines up with the organism name.','Version 1.0: the beta label is removed. All 248 organisms and 15 syndromes show their source or are marked as general knowledge, and the entries with the least support have been cross-checked against Mandell, Douglas and Bennett (9th ed).'],featuresTh:['มุมมองโน้ต: ข้อความชื่อยาบรรทัดแรกจัดแนวตรงกับชื่อเชื้อ','เวอร์ชัน 1.0: ยกเลิกป้าย beta เชื้อทั้ง 248 ชนิดและกลุ่มอาการ 15 กลุ่มแสดงแหล่งอ้างอิงหรือระบุว่าเป็นความรู้ทั่วไป และรายการที่มีหลักฐานสนับสนุนน้อยที่สุดได้ตรวจเทียบกับ Mandell, Douglas and Bennett (ฉบับที่ 9) แล้ว'],bugs:[],bugsTh:[]},{version:'0.9.6',date:'November 23, 2026',dateTh:'23 พฤศจิกายน 2569',features:['Non-pathogenic Neisseria: rare invasive infections and susceptibility testing added (Mandell).','Hantavirus: Mandell added (ribavirin evidence in HFRS, fluid caution, cardiotonics, no heparin).','Clonorchis sinensis: Mandell praziquantel schedules and alternatives added.','Burkholderia cepacia complex: Mandell susceptibility notes added (active drugs, tobramycin in cystic fibrosis, newer agents).','Yersinia species: enteric yersiniosis (Mandell) added: supportive care, when to treat, susceptible and resistant drugs.','Rhodococcus equi: Mandell combination rules, durations and the drugs to avoid added.','Pasteurella multocida: penicillin is the drug of choice once identified (Mandell), with the susceptibility list and the hand-bite warning.','Notes view: the first-line text beside an organism now always names a drug or says supportive care, never an indication phrase.','Notes view: lighter rows and a tighter indent, one-line groups when a group holds a single sub-group, a pinned path while you scroll, a coloured dot on each organism for its evidence level, an ⓘ button for details, details in a column on wide screens, arrow-key navigation, highlighted search matches with their group and Enter to jump, Open to level 1 / 2 / 3 / All in More, and a back-to-top button on phones.','Toolbar simplified: one row with Search, the Map / Notes / Table switch, Filters, Tools and More; Expand moved into More and is hidden in Table view; no decorative icons; buttons are plain until hovered; Filters shows a dot when something is selected.','Organisms inside each smallest group are now listed in alphabetical order (Map, Notes, Table and the group detail box).','New Source filter: Thai guideline, International source, Siriraj handbook, Handbook only (not yet checked against a newer source) and No regimen listed.','Filters box: one group per row, a closed group shows what is chosen, a bar of removable chips shows the active filters even when the box is closed, every chip shows how many organisms it would give and greys out at zero, and Gram stain is greyed when Type excludes bacteria.','Show related (grey) and First-line on rows are now on by default; your own choice is still remembered.','Anthrax now has a regimen from the CDC 2023 guideline.','Blastomycosis and coccidioidomycosis follow the IDSA guidelines.','M. avium complex, M. kansasii and M. xenopi follow the 2020 ATS/ERS/ESCMID/IDSA NTM guideline; M. abscessus notes the susceptibility advice.','Mycoplasma now has doses and the Asian macrolide-resistance figures, and dermatophytes list oral terbinafine, itraconazole and fluconazole (Mandell).','Three fluke entries (Fasciolopsis, Paragonimus, Fasciola) note the Mandell dose schedules beside the handbook ones.','Fusarium now lists lipid amphotericin B as an alternative, and Scedosporium notes Lomentospora resistance and the voriconazole response (Mandell).','Sporothrix now lists itraconazole as first line for cutaneous disease (Mandell), with amphotericin B for disseminated disease.','Influenza now lists the Mandell antiviral doses; the vivax entry notes that WHO lists primaquine 0.25 mg/kg/day for radical cure.','Entamoeba (tinidazole 2 g daily for 3–5 days) and Strongyloides (disseminated disease: ivermectin for 14 days in Mandell) now carry the Mandell doses beside the handbook ones.','Shigella and cholera now list the Mandell doses and alternatives (cefixime, levofloxacin, single-dose azithromycin and doxycycline) beside the handbook doses.','Listeria entry updated after a Mandell check: gentamicin for synergy in CNS disease and endocarditis, cephalosporins do not treat it, steroid and first-trimester co-trimoxazole warnings, meropenem second line.','Trichosporon, Malassezia furfur, Streptomyces and other Bacillus species now cite Mandell (9th ed, 2020); B. cereus and C. guilliermondii gain Mandell notes.','C. guilliermondii cites the IDSA 2016 candidiasis guideline (voriconazole step-down).','M. gordonae, M. haemophilum and M. mucogenicum now follow the ATS/IDSA 2007 NTM statement.','Four rare organisms (C. tertium, B. cepacia complex, B. parapertussis, E. tarda) now cite weak sources such as case series, a regional protocol or an extrapolation; each entry says so.','HACEK and nutritionally variant streptococci (ESC 2023), Serratia, Morganella, Providencia, Plesiomonas and Rhodococcus now cite their sources.','Actinomyces, Erysipelothrix, C. septicum, Pasteurella and B. cereus now cite reference pages (MSD Manual, UKHSA, BCCDC).','Brucella, Capnocytophaga and the coagulase-negative staphylococci now cite the CDC and IDSA guidance.','Klebsiella variicola now cites published reviews (treat like K. pneumoniae, by susceptibility).','Hypervirulent Klebsiella now follows a 2026 management review (source control, ceftriaxone, carbapenemase options).','Hantavirus, EBV, rhinovirus, parvovirus B19 and kuru now cite the CDC or MedlinePlus; K. aerogenes follows the IDAT AmpC section.','Diphtheria (under Corynebacterium) and pertussis now cite the CDC clinical pages.','Tetanus, botulism (with the Thai Ramathibodi antitoxin protocol), plague, tularemia and rat-bite fever now cite CDC guidelines.','Enterobacter, Citrobacter and Hafnia follow the IDAT 2026 AmpC regimen.','Malaria and tuberculosis entries now include the HIV guideline points (relapse prevention, pregnancy, treatment length, IRIS).','Cryptococcosis, PCP, toxoplasmosis, MAC, cryptosporidiosis, cystoisosporiasis, CMV, HSV, VZV, syphilis, visceral leishmaniasis and mucosal candidiasis now include the NIH HIV opportunistic infection regimens.','Bartonella, mpox, talaromycosis and histoplasmosis follow the NIH HIV opportunistic infection guideline.','Microsporidia follow the NIH adult HIV opportunistic infection guideline.','M. malmoense, szulgai, genavense and simiae follow the 2022 consensus on less common NTM.','Balantidium, Blastocystis, Acanthamoeba, sleeping sickness and paracoccidioidomycosis now cite the CDC or a published review.','Liver fluke, Ebola, Lassa, CCHF and HFMD entries now also cite the working CDC pages.','Prions (sporadic, variant, iatrogenic and genetic CJD), polio, HTLV-1, mumps, rubella and molluscum cite the CDC or WHO.','Hepatitis D, HPV warts, liver flukes (Clonorchis, Opisthorchis), Ebola, Lassa, CCHF, MERS and Nipah now cite the CDC or WHO.','Yellow fever has its treatment and vaccine notes from the CDC and WHO.','Each of these entries has a source button.'],featuresTh:['Neisseria ที่ไม่ก่อโรค: เพิ่มการติดเชื้อรุกรานที่พบน้อยและการทดสอบความไวต่อยา (Mandell)','Hantavirus: เพิ่มข้อมูลจาก Mandell (หลักฐาน ribavirin ใน HFRS ระวังการให้สารน้ำ ยากระตุ้นหัวใจ ไม่ใช้ heparin)','Clonorchis sinensis: เพิ่มขนาดยา praziquantel และยาทางเลือกจาก Mandell','Burkholderia cepacia complex: เพิ่มข้อมูลความไวต่อยาจาก Mandell (ยาที่ออกฤทธิ์ tobramycin ในซีสต์ไฟโบรซิส และยากลุ่มใหม่)','Yersinia species: เพิ่มโรคลำไส้อักเสบจากเยอร์ซิเนีย (Mandell) ได้แก่ การรักษาประคับประคอง เมื่อไรควรให้ยา ยาที่ไวและยาที่ดื้อ','Rhodococcus equi: เพิ่มหลักการใช้ยาร่วม ระยะเวลา และยาที่ควรหลีกเลี่ยงจาก Mandell','Pasteurella multocida: เพนิซิลลินเป็นยาที่เลือกเมื่อยืนยันเชื้อแล้ว (Mandell) พร้อมรายการความไวต่อยาและคำเตือนแผลกัดที่มือ','มุมมองโน้ต: ข้อความบรรทัดแรกข้างชื่อเชื้อแสดงชื่อยาหรือการรักษาประคับประคองเสมอ ไม่แสดงข้อความบอกข้อบ่งชี้','มุมมองโน้ต: แถวเบาลงและย่อหน้าแคบลง กลุ่มที่มีกลุ่มย่อยเดียวรวมเป็นบรรทัดเดียว แสดงเส้นทางกลุ่มค้างไว้ขณะเลื่อน จุดสีบอกระดับ   ['f','a','x'].map(r=>e.o[r].size?'<details open style="--c:'+col[r]+'"><summary>'+esc(lab[r])+' ('+e.o[r].size+')</summary><ul>'+[...e.o[r]].sort().map(orgLi).join('')+'</ul></details>':'').join('')}
function renderEmp(){
 const syn=P.filter(p=>p.syn);
 $('#tbody').innerHTML='<p class="by">'+esc(T('t2h'))+'</p><label class="by" for="es">'+esc(T('t2s'))+'</label><select id="es" class="tin">'+syn.map(p=>'<option value="'+esc(p.n)+'">'+esc(p.n)+'</option>').join('')+'</select>'+
  '<div class="fs"><h4>'+esc(T('t2m'))+'</h4><div class="chips">'+EMPMODS.map(m=>'<button class="chip" data-mod="'+m[0]+'" aria-pressed="false">'+esc(m[1])+'</button>').join('')+'</div></div><div id="eres"></div>';
 empResult()}
function empResult(){
 const p=orgBy($('#es').value),mods=[...document.querySelectorAll('#tbody [data-mod][aria-pressed="true"]')].map(b=>b.dataset.mod);
 const sel=EMPMODS.filter(m=>mods.includes(m[0])),col={f:'var(--f)',a:'var(--a)'};
 const li=l=>{const h=sel.filter(m=>m[2].test(l)).map(m=>m[1]);return '<li'+(h.length?' class="mh"':'')+'>'+esc(l)+(h.length?' <span class="by">← '+esc(h.join('; '))+'</span>':'')+'</li>'};
 $('#eres').innerHTML='<h3 style="margin:10px 0 4px">'+esc(p.n)+'</h3>'+
  (p.note?'<div class="by">'+esc(p.note)+'</div>':'')+
  '<details open style="--c:var(--f)"><summary>'+esc(T('emp'))+'</summary><ul>'+p.f.map(li).join('')+'</ul></details>'+
  (p.a.length?'<details open style="--c:var(--a)"><summary>'+esc(T('alt'))+'</summary><ul>'+p.a.map(li).join('')+'</ul></details>':'')+
  '<div class="warn">'+esc(T('t2w'))+' '+esc(T('source'))+' '+HBN+', '+esc(p.h||'')+'. '+esc(T('verify'))+'</div>'}
function renderClues(){
 $('#tbody').innerHTML='<p class="by">'+esc(T('t3h'))+'</p>'+Object.keys(CLUEGRP).map(g=>'<div class="fs"><h4>'+esc(CLUEGRP[g])+'</h4><div class="chips">'+CLUES.filter(c=>c[1]===g).map(c=>'<button class="chip" data-clue="'+c[0]+'" aria-pressed="'+clueSel.has(c[0])+'">'+esc(c[2])+'</button>').join('')+'</div></div>').join('')+'<div id="cres"></div>';
 clueResult()}
function clueResult(){
 const sel=CLUES.filter(c=>clueSel.has(c[0])),box=$('#cres');
 if(!sel.length){box.innerHTML='<div class="by">'+esc(T('t3e'))+'</div>';return}
 const sc=new Map();sel.forEach(c=>c[3].forEach(n=>{if(!sc.has(n))sc.set(n,[]);sc.get(n).push(c[2])}));
 const rows=[...sc.entries()].filter(([n])=>orgBy(n)).sort((a,b)=>b[1].length-a[1].length||a[0].localeCompare(b[0])).slice(0,40);
 box.innerHTML='<h3 style="margin:12px 0 4px">'+esc(T('t3r'))+' ('+rows.length+')</h3><ul class="cl">'+rows.map(([n,m])=>'<li><span class="pl" data-go="'+esc(n)+'" tabindex="0" role="link">'+esc(n)+'</span> <b>'+m.length+'/'+sel.length+'</b> <span class="by">'+esc(m.join(' · '))+'</span></li>').join('')+'</ul><div class="warn">'+esc(T('t3w'))+'</div>'}
function addCmp(name,drug){const a=drug?cmp.d:cmp.o;cmp.mode=drug?'d':'o';if(!a.includes(name))a.push(name);if(a.length>3)a.shift()}
function renderCmp(){
 const m=cmp.mode,items=cmp[m];
 $('#tbody').innerHTML='<div class="chips"><button class="chip" data-cmode="o" aria-pressed="'+(m==='o')+'">'+esc(T('t4o'))+'</button><button class="chip" data-cmode="d" aria-pressed="'+(m==='d')+'">'+esc(T('t4d'))+'</button></div>'+
  '<p class="by">'+esc(T('t4h'))+'</p><input id="cq" type="search" class="tin" placeholder="'+esc(T('t4p'))+'" aria-label="'+esc(T('t4p'))+'"><div id="clist" class="chips"></div><div id="ctab"></div>';
 cmpList();cmpTable()}
function cmpList(){
 const q=($('#cq').value||'').trim().toLowerCase(),m=cmp.mode;
 const pool=m==='o'?P.filter(p=>!p.syn).map(p=>p.n):drugIndex().map(e=>e.name);
 const hit=pool.filter(n=>q&&n.toLowerCase().includes(q)).slice(0,24);
 $('#clist').innerHTML=hit.map(n=>'<button class="chip" data-cadd="'+esc(n)+'">+ '+esc(n)+'</button>').join('')}
function cmpTable(){
 const m=cmp.mode,items=cmp[m],box=$('#ctab');
 if(!items.length){box.innerHTML='';return}
 const ul=a=>a&&a.length?'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<span class="by">—</span>';
 let rows;
 if(m==='o'){
  const ps=items.map(orgBy).filter(Boolean);
  rows=[[T('fk'),ps.map(p=>esc(topName(p)))],[T('fe'),ps.map(p=>esc(endemicOf(p)||T('ww')))],[T('tsc'),ps.map(p=>esc(testsOf(p)[0]))],[T('tdx'),ps.map(p=>esc(testsOf(p)[1]))],[T('first'),ps.map(p=>ul(p.f))],[T('alt'),ps.map(p=>ul(p.a))],[T('avoid'),ps.map(p=>ul(p.x))],[T('key'),ps.map(p=>esc(p.note||'—'))],[T('source'),ps.map(p=>esc(p.h?HBN+', '+p.h:p.nh?T('nh'):T('unchecked')))]];
  items.length=ps.length;
 }else{
  const es=items.map(n=>drugIndex().find(e=>e.name===n)).filter(Boolean),ds=es.map(e=>doseFor(e.name));
  const sets=es.map(e=>new Set([...e.o.f,...e.o.a])),common=sets.length>1?[...sets[0]].filter(n=>sets.every(s=>s.has(n))).sort():[];
  rows=[[T('dclass'),ds.map(d=>esc(d?d[1]:'—'))],[T('duse'),ds.map(d=>esc(d?d[2]:'—'))],[T('ddose'),ds.map(d=>esc(d?d[3]:'—'))],[T('dadr'),ds.map(d=>esc(d&&d[4]?d[4]:'—'))],[T('first'),es.map(e=>ul([...e.o.f].sort()))],[T('alt'),es.map(e=>ul([...e.o.a].sort()))],[T('avoid'),es.map(e=>ul([...e.o.x].sort()))]];
  if(sets.length>1)rows.push([T('t4c'),[ul(common)].concat(es.slice(1).map(()=>''))]);
  items.length=es.length;
 }
 box.innerHTML='<div class="cwrap"><table class="cmpt"><thead><tr><th></th>'+items.map(n=>'<th>'+esc(n)+' <button class="ib sm" data-crem="'+esc(n)+'" aria-label="Remove">✕</button></th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr><th>'+esc(r[0])+'</th>'+r[1].map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function goOrg(name){
 const p=orgBy(name);if(!p)return;
 closeTools();Object.values(flt).forEach(s=>s.clear());updateFl();q='';$('#q').value='';savedOnly=false;recentOnly=false;syncBtns();
 cur=null;for(let g=p.c;g;g=CAT[g].g)open.add(g);sel='p:'+name;
 if(mode==='notes'){cur=p;detKey=sel;setHash(p);renderNotes();const el=document.querySelector('#notes .det');el&&el.scrollIntoView({block:'center'})}
 else{fit();showDetails(sel)}}
$('#tl').onclick=()=>openTools();
$('#tcl').onclick=closeTools;
$('#tkit').addEventListener('click',e=>{
 if(e.target.id==='tkit'){closeTools();return}
 const g=e.target.closest('[data-go]');if(g){goOrg(g.dataset.go);return}
 const tb=e.target.closest('[data-tab]');if(tb){tTab=tb.dataset.tab;renderTools();return}
 const ds=e.target.closest('[data-dsel]');if(ds){tDrugSel=ds.dataset.dsel;drugList();drugDetail();return}
 const cd=e.target.closest('[data-cadd-d]');if(cd){addCmp(cd.dataset.caddD,true);tTab='cmp';renderTools();return}
 const md=e.target.closest('[data-mod]');if(md){md.setAttribute('aria-pressed',md.getAttribute('aria-pressed')!=='true');empResult();return}
 const cl=e.target.closest('[data-clue]');if(cl){const k=cl.dataset.clue;if(clueSel.has(k))clueSel.delete(k);else clueSel.add(k);cl.setAttribute('aria-pressed',clueSel.has(k));clueResult();return}
 const cm=e.target.closest('[data-cmode]');if(cm){cmp.mode=cm.dataset.cmode;renderCmp();return}
 const ca=e.target.closest('[data-cadd]');if(ca){addCmp(ca.dataset.cadd,cmp.mode==='d');renderCmp();return}
 const cr=e.target.closest('[data-crem]');if(cr){const a=cmp[cmp.mode],i=a.indexOf(cr.dataset.crem);if(i>=0)a.splice(i,1);renderCmp();return}});
$('#tkit').addEventListener('input',e=>{if(e.target.id==='dq')drugList();else if(e.target.id==='cq')cmpList()});
$('#tkit').addEventListener('change',e=>{if(e.target.id==='es')empResult()});
$('#tkit').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.pl')){e.preventDefault();e.target.click()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#tkit').hidden)closeTools()});

applyLang(true);

setMode('notes'); // Notes is the default view
fit();openFromHash();
