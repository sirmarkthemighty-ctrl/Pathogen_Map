<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pathogen Map</title>
<script>try{var t=localStorage.getItem('pmap-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
:root{--bg:#f6f8fb;--card:#fff;--tx:#1c2733;--mut:#5b6b7b;--line:#c9d3de;--acc:#0f6cbd;--f:#17935a;--a:#2a74d0;--x:#cf3b3b}
:root[data-theme=dark]{--bg:#10161d;--card:#18212b;--tx:#e6edf4;--mut:#9fb0c0;--line:#33424f;--acc:#5aa9f0;--f:#3fc585;--a:#6ea8f0;--x:#f07272}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10161d;--card:#18212b;--tx:#e6edf4;--mut:#9fb0c0;--line:#33424f;--acc:#5aa9f0;--f:#3fc585;--a:#6ea8f0;--x:#f07272}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,"Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0}
.by{font-size:11px;color:var(--mut)}
#ver{border:1px solid var(--line);background:none;color:var(--acc);border-radius:99px;padding:1px 9px;font-size:11px;cursor:pointer}
#q{flex:1 1 180px;min-width:140px;max-width:360px;margin-left:auto;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx);font-size:14px}
.ib{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--tx);cursor:pointer;font-size:15px;line-height:1}
.legend{display:flex;gap:12px;font-size:12px;color:var(--mut);padding:4px 16px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
main{position:relative;flex:1;min-height:0}
#svg{width:100%;height:100%;touch-action:none;cursor:grab;display:block}
.nd{cursor:pointer}
.nd rect{fill:color-mix(in srgb,var(--c) 14%,var(--card));stroke:var(--c);stroke-width:1.5}
.nd.root rect,.nd.cat rect{fill:var(--c)}
.nd.root text,.nd.cat text{fill:#fff;font-weight:600}
.nd text{fill:var(--tx);font-size:13px;dominant-baseline:central}
.nd .tg{font-size:10px;fill:var(--mut);font-weight:600}
.nd.sel rect{stroke-width:3}
.nd.hit rect{stroke-width:3;stroke-dasharray:none;filter:drop-shadow(0 0 4px var(--c))}
#notes{display:none;position:absolute;inset:0;overflow:auto;padding:14px 16px 60px;
 --g:#cfe3f3;background:linear-gradient(var(--g) 1px,transparent 1px) 0 0/26px 26px,linear-gradient(90deg,var(--g) 1px,transparent 1px) 0 0/26px 26px,var(--bg);
 font:18px/26px "Segoe Print","Bradley Hand","Chalkboard SE","Comic Sans MS",cursive}
:root[data-theme=dark] #notes{--g:#22313f}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) #notes{--g:#22313f}}
#notes .title{font-size:24px;line-height:36px;margin-bottom:6px}
#notes .row{cursor:pointer;display:inline-block;padding:0 4px;border-radius:4px}
#notes .row.sel{background:color-mix(in srgb,var(--acc) 20%,transparent)}
#notes .row.hit{background:#ffe56b66}
#notes small{font:600 11px system-ui;margin-right:2px}
#notes .it{position:relative}
#notes .kids{margin-left:10px;padding-left:16px}
#notes .kids>.it:not(:last-child){border-left:2px solid var(--ink)}
#notes .kids>.it::before{content:'';position:absolute;left:-2px;top:0;width:14px;height:14px;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);border-bottom-left-radius:7px}
#notes .kids>.it>.row,#notes .kids>.it>.kids{position:relative}
#notes .kids>.it{padding-left:0}
#notes .kids>.it>.row{margin-left:18px}
#notes .kids>.it>.kids{margin-left:28px}
#notes .d0{--ink:#2740d6}#notes .d1{--ink:#2740d6}#notes .d2{--ink:#1f9a3d}#notes .d3{--ink:#1f9a3d}
#notes .d1>.row,#notes .d0>.kids>.it>.row{color:#2740d6}
#notes .d2>.row{color:#1f9a3d}
:root[data-theme=dark] #notes .d1>.row,:root[data-theme=dark] #notes .d0>.kids>.it>.row{color:#7d95ff}
:root[data-theme=dark] #notes .d2>.row{color:#52d17a}
.ed{fill:none;stroke:var(--line);stroke-width:1.5}
#tools{position:absolute;left:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
#panel{position:absolute;right:0;top:0;bottom:0;width:340px;max-width:100%;background:var(--card);border-left:1px solid var(--line);padding:12px 14px;overflow:auto;transform:translateX(100%);transition:transform .2s}
#panel.on{transform:none}
#panel h2{font-size:17px;margin:0 28px 2px 0}
#panel .cl{position:absolute;right:8px;top:8px}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;color:#fff;margin-bottom:6px}
details{border:1px solid var(--line);border-left:4px solid var(--c,var(--line));border-radius:8px;margin:8px 0;padding:4px 10px}
summary{cursor:pointer;font-weight:600;font-size:13px}
details ul{margin:4px 0 6px;padding-left:18px}
.pl{color:var(--acc);cursor:pointer;text-decoration:underline}
.warn{font-size:11px;color:var(--mut);margin-top:10px}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:9}
#modal.on{display:flex}
#modal>div{background:var(--card);border-radius:12px;padding:16px;max-width:420px;width:calc(100% - 32px);max-height:80vh;overflow:auto}
@media(max-width:640px){
 #panel{top:auto;left:0;width:100%;height:48%;border-left:0;border-top:1px solid var(--line);transform:translateY(100%)}
 #panel.on{transform:none}
 header{padding:8px 16px}
}
</style>
</head>
<body>
<header>
 <div><h1>Pathogen Map <button id="ver"></button></h1><div class="by">Interactive pathogen &amp; antimicrobial mind map · Made by Warodom Phaenthong, M.D.</div></div>
 <input id="q" type="search" placeholder="Search pathogen or drug…" aria-label="Search">
 <button class="ib" id="vw" style="width:auto;padding:0 12px;border-radius:99px;font-size:13px" title="Switch between mind map and handwritten notes view">📝 Notes</button>
 <button class="ib" id="th" aria-label="Toggle theme"></button>
</header>
<div class="legend"><span><i style="background:var(--f)"></i>First-line</span><span><i style="background:var(--a)"></i>Alternative</span><span><i style="background:var(--x)"></i>Avoid / intrinsic resistance</span><span>Tap a node to expand · drag to pan · pinch/scroll to zoom</span></div>
<main>
 <svg id="svg"><g id="vp"><g id="eg"></g><g id="ng"></g></g></svg>
 <div id="notes"></div>
 <div id="tools"><button class="ib" id="zi">+</button><button class="ib" id="zo">−</button><button class="ib" id="zf" title="Fit">⤢</button></div>
 <aside id="panel"><button class="ib cl" id="pc">✕</button><div id="pb"></div></aside>
</main>
<div id="modal"><div id="mb"></div></div>
<script>
const changelogData=[{version:'1.1.0',date:'November 18, 2026',features:['Drug lists checked against the Siriraj Handbook of Infectious Disease: each checked entry shows its handbook page; unchecked entries are labelled','Added from the handbook: Shigella, EHEC, viruses (VZV, measles, dengue, chikungunya/Zika, influenza, RSV, SARS-CoV-2, hepatitis A/B/C/E, HIV), S. suis, group C/G streptococci, non-typhoidal Salmonella, rickettsiae, M. kansasii, M. abscessus, Pneumocystis, Mucorales, Histoplasma','Mind map of bacteria, fungi, protozoa and parasites (helminths, ectoparasites): 73 pathogens, each with first-line, alternative and avoid drugs','Notes view: handwritten-style outline on grid paper with bracket connectors (toggle next to the theme button)','Gram-positive cocci split by lab test: staphylococci (coagulase-positive / -negative) and streptococci & enterococci (β-, α-, γ-hemolytic)','Tap a drug to see every pathogen that lists it','Search by pathogen or drug; pan and zoom; light/dark theme'],bugs:[]}];

// c=category, f=first-line, a=alternative, x=avoid, note=pearl
const P=[
{n:'MSSA',c:'cps',f:['Cloxacillin','Cefazolin'],a:['Cephalexin (mild, oral)','Clindamycin (if susceptible)','TMP-SMX (skin)','Vancomycin (β-lactam allergy)'],x:['Penicillin G'],note:'A β-lactam beats vancomycin for MSSA bacteraemia. Repeat blood cultures, look for a focus, consider echocardiography.'},

{n:'Streptococcus pneumoniae',c:'ahs',f:['Amoxicillin (high dose)','Ceftriaxone (severe)'],a:['Levofloxacin / moxifloxacin','Doxycycline (mild)','Vancomycin + ceftriaxone (meningitis)'],x:['Macrolide monotherapy (resistance common)'],note:'Penicillin breakpoints differ for meningitis and non-meningitis. Check local macrolide resistance.'},

{n:'Staphylococcus saprophyticus',c:'cns',f:['Nitrofurantoin','Fosfomycin'],a:['TMP-SMX','Cephalexin'],x:['Novobiocin (identification only)'],note:'Uncomplicated cystitis in sexually active young women; novobiocin-resistant.'},
{n:'Coagulase-negative staphylococci',c:'cns',f:['Vancomycin'],a:['Cloxacillin (if methicillin-susceptible)','Linezolid','Daptomycin'],x:[],note:'Frequent blood-culture contaminant; true infection is mainly device or prosthesis related. Rifampicin is an adjunct for prosthetic material only after bacteraemia clears.'},

{n:'Listeria monocytogenes',c:'gpb',f:['Ampicillin (± gentamicin in CNS / severe)'],a:['TMP-SMX'],x:['Cephalosporins (inactive)'],note:'Add ampicillin to empiric meningitis therapy in adults >50 y, pregnancy and immunocompromise.'},

{n:'Klebsiella pneumoniae',c:'ent',f:['Ceftriaxone'],a:['Piperacillin-tazobactam','Ciprofloxacin / levofloxacin (if susceptible)','TMP-SMX (if susceptible)'],x:['Ampicillin (intrinsic)'],note:'Hypervirulent strains cause liver abscess and metastatic infection (eye, CNS) — look for these.'},
{n:'ESBL-producing Enterobacterales',c:'ent',f:['Meropenem','Ertapenem (non-critically ill)'],a:['Nitrofurantoin / fosfomycin (cystitis)','Oral step-down: FQ or TMP-SMX if susceptible'],x:['Ceftriaxone','Piperacillin-tazobactam (bacteraemia)','Cefepime'],note:'MERINO: piperacillin-tazobactam was inferior to meropenem for ceftriaxone-resistant bacteraemia.'},
{n:'Carbapenem-resistant Enterobacterales (CRE)',c:'ent',f:['Ceftazidime-avibactam (KPC, OXA-48)','Meropenem-vaborbactam (KPC)','Ceftazidime-avibactam + aztreonam (NDM / MBL)'],a:['Cefiderocol','Colistin-based combination','Tigecycline','Fosfomycin (cystitis)'],x:['Carbapenem monotherapy'],note:'Identify the carbapenemase (KPC, NDM, OXA-48, VIM) before choosing; it determines the agent. Involve infectious diseases.'},

{n:'Stenotrophomonas maltophilia',c:'nf',f:['TMP-SMX'],a:['Levofloxacin','Minocycline','Cefiderocol','Ceftazidime-avibactam + aztreonam'],x:['Carbapenems (intrinsic)'],note:'Intrinsically carbapenem-resistant; often selected by carbapenem exposure.'},
{n:'Burkholderia pseudomallei (melioidosis)',c:'nf',f:['Ceftazidime (intensive phase)','Meropenem (intensive phase, severe)'],a:['TMP-SMX (eradication, 3–6 months)','Amoxicillin-clavulanate (eradication, if TMP-SMX not tolerated)','Doxycycline'],x:['Aminoglycosides','Macrolides'],note:'Endemic in north-east Thailand. Intensive phase at least 10–14 days (longer for CNS, bone, prostate), then eradication; short courses relapse.'},

{n:'Helicobacter pylori',c:'ogn',f:['Bismuth quadruple: PPI + bismuth + tetracycline + metronidazole (14 d)'],a:['Vonoprazan + amoxicillin','Clarithromycin triple (only if susceptible)','Levofloxacin-based (rescue)'],x:['Clarithromycin triple where resistance is high'],note:'Confirm eradication ≥4 weeks after therapy, off PPI 2 weeks. Tailor to local clarithromycin resistance.'},
{n:'Vibrio cholerae',c:'ogn',f:['Doxycycline (single dose)','Azithromycin (single dose)'],a:['Ciprofloxacin'],x:[],note:'Rehydration is the mainstay; antibiotics shorten illness. Check local resistance.'},

function kids(n){
 if(n.t==='root'||n.t==='cat'){
  const g=n.t==='root'?null:n.key;
  return[...CATS.filter(c=>c.g===g).map(c=>({key:c.id,t:'cat',label:c.n,color:c.c,data:c})),
   ...P.filter(p=>p.c===g).map(p=>({key:'p:'+p.n,t:'pat',label:p.n,color:CAT[p.c].c,data:p}))];}
 if(n.t==='pat')return['f','a','x'].flatMap(r=>n.data[r].map(d=>({key:n.key+r+d,t:'drug',role:r,label:d,color:ROLE[r][0],data:n.data})));
 return[];}
function hits(n){ // does node or descendant match query
 if(!q)return true;
 if(n.t==='drug')return n.label.toLowerCase().includes(q);
 if(n.label.toLowerCase().includes(q))return true;
 return kids(n).some(hits);}
function isOpen(n){ if(n.t==='drug')return false; if(q)return n.t==='root'||(n.t==='cat')||kids(n).some(k=>k.t==='drug'&&hits(k)); return n.t==='root'||open.has(n.key);}

 const root={key:'root',t:'root',label:'Infectious pathogens',color:'#0f6cbd'};
 (function walk(n,d,parent){
  n.d=d;n.p=parent;let ks=isOpen(n)?kids(n):[];
  if(q)ks=ks.filter(hits);
  n.more=!ks.length&&n.t!=='drug'&&kids(n).length;
  if(!ks.length){n.y=y;y+=ROW}else{ks.forEach(k=>walk(k,d+1,n));n.y=(ks[0].y+ks[ks.length-1].y)/2}
  nodes.push(n);if(parent)edges.push([parent,n]);})(root,0,null);

 const xs=[0];for(let i=1;i<mw.length;i++)xs[i]=xs[i-1]+mw[i-1]+38;
 nodes.forEach(n=>n.x=xs[n.d]);
 return edges;}

function fit(){

function click(key){

  const was=open.has(key);open=new Set();

svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoom(e.deltaY<0?1.12:.89,e.clientX-r.left,e.clientY-r.top)},{passive:false});
$('#zi').onclick=()=>zoom(1.25);$('#zo').onclick=()=>zoom(.8);$('#zf').onclick=fit;
$('#pc').onclick=()=>{$('#panel').classList.remove('on');sel=null;refresh()};
$('#pb').addEventListener('click',e=>{const p=e.target.dataset.p;if(p){const pp=P.find(x=>x.n===p);open.clear();for(let g=pp.c;g;g=CAT[g].g)open.add(g);open.add('p:'+p);sel='p:'+p;q='';$('#q').value='';showPat(pp);refresh('p:'+p)}});
$('#q').oninput=e=>{q=e.target.value.trim().toLowerCase();mode==='notes'?renderNotes():fit()};
// notes view: handwritten-style outline with bracket connectors, same data and open state as the map
let mode='map',NM={};
function renderNotes(){
 NM={};const root={key:'root',t:'root',label:'Infectious pathogens',p:null};NM.root=root;
 const h=(n,d)=>{
  let ks=isOpen(n)?kids(n):[];if(q)ks=ks.filter(hits);
  const canOpen=n.t!=='drug'&&kids(n).length;
  const mark=canOpen?(ks.length?'▾ ':'▸ '):'';
  const tag=n.t==='drug'?`<small style="color:${ROLE[n.role][0]}">${ROLE[n.role][1]}</small> `:'';
  const cls=['row',sel===n.key?'sel':'',q&&n.t!=='root'&&n.label.toLowerCase().includes(q)?'hit':''].join(' ');
  const self=n.t==='root'?`<div class="title">• ${esc(n.label)}</div>`:`<div class="${cls}" data-k="${esc(n.key)}" style="color:${n.t==='drug'?ROLE[n.role][0]:''}">${mark}${tag}${esc(n.label)}</div>`;
  ks.forEach(k=>{k.p=n;NM[k.key]=k});
  return`<div class="it d${Math.min(d,3)}">${self}${ks.length?`<div class="kids">${ks.map(k=>h(k,d+1)).join('')}</div>`:''}</div>`};
 $('#notes').innerHTML=h(root,0);}
$('#notes').addEventListener('click',e=>{const r=e.target.closest('.row');r&&click(r.dataset.k)});
$('#vw').onclick=()=>{mode=mode==='map'?'notes':'map';const nt=mode==='notes';
 $('#notes').style.display=nt?'block':'none';svg.style.display=nt?'none':'block';$('#tools').style.display=nt?'none':'flex';
 $('#vw').textContent=nt?'🗺 Map':'📝 Notes';nt?renderNotes():fit()};
// theme
function setIcon(){const d=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;$('#th').textContent=d?'☀️':'🌙'}
$('#th').onclick=()=>{const d=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches,n=d?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('pmap-theme',n)}catch(e){}setIcon()};
setIcon();
// changelog
$('#ver').textContent='v'+changelogData[0].version;
$('#ver').onclick=()=>{$('#mb').innerHTML='<h2 style="margin-top:0">Changelog</h2>'+changelogData.map(c=>`<h3>v${c.version} · ${c.date}</h3><ul>${c.features.map(f=>`<li>${esc(f)}</li>`).join('')}${c.bugs.map(f=>`<li>Fix: ${esc(f)}</li>`).join('')}</ul>`).join('')+'<button class="ib" style="width:auto;padding:4px 14px;border-radius:8px" id="mx">Close</button>';$('#modal').classList.add('on');$('#mx').onclick=()=>$('#modal').classList.remove('on')};
$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('on')};
addEventListener('resize',()=>{});
fit();
</script>
</body>
